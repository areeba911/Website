<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ember & Bloom — Specialty Coffee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Critical inline styles to ensure page is never blank */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        min-height: 100vh;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background-color: #FDF8F3;
        color: #2C1810;
      }
      #root {
        min-height: 100vh;
      }
      /* Fallback visible content if JS fails */
      .noscript-fallback {
        max-width: 600px;
        margin: 0 auto;
        padding: 60px 20px;
        text-align: center;
      }
      .noscript-fallback h1 {
        font-size: 28px;
        margin-bottom: 16px;
        color: #2C1810;
      }
      .noscript-fallback p {
        color: #6B4226;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Fallback content visible before JS loads -->
      <div class="noscript-fallback">
        <h1>☕ Ember & Bloom</h1>
        <p>Specialty Coffee — Loading...</p>
      </div>
    </div>
    <noscript>
      <div class="noscript-fallback">
        <h1>☕ Ember & Bloom</h1>
        <p>Please enable JavaScript to view this site.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
